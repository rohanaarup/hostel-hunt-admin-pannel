# Reference configuration for the Render web service. It documents the
# settings to enter in the Render dashboard; applying it as a Blueprint may
# create a new service instead of adopting the existing one, so copy the
# values by hand unless you intend that.
#
# Nothing in the Django code depends on Render: on your own server run the same
# build commands, start command and environment variables.
#
# RECONCILING WITH THE LIVE DASHBOARD (F3-09). This file was brought in line with the code on 2026-10-29. It has
# NOT been compared with the dashboard (nobody but the founder can open it). FOUNDER_CHECKLIST_PROD.md, step 2a,
# does the comparison: for each service, the build command, start command, health check path and the NAMES of the
# environment variables must match what is below. Names only: never paste a value anywhere.
#
# Variables that must NOT exist on the production service (they are for tests or development):
#   THROTTLE_ANON, THROTTLE_USER (load tests, staging only), EXPOSE_DEV_OTP, USE_DB, LOCAL_DATABASE_URL,
#   APP_ENV=staging, DEBUG=True.
# Optional on production, set after the matching step in the checklist: SECURE_HSTS_SECONDS (31536000, only once
# HTTPS is proven on the final domain; hard to undo), SENTRY_TRACES_SAMPLE_RATE (0.1; leave PII off, which is the
# default), TRUSTED_PROXY_COUNT (default 1; check the request log field xff_hops first).
services:
  - type: web
    name: hostel-hunt-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    # Migrations run during the build because the free plan has no pre-deploy
    # step. On a paid plan move `migrate` to preDeployCommand.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # GIT_COMMIT tags log lines and Sentry events with the deployed version. Render sets
    # RENDER_GIT_COMMIT; keeping the mapping here keeps the Django code host-neutral.
    # DB_STATEMENT_TIMEOUT_MS caps one database statement (25 s, under gunicorn's 60 s). It is set here, on the web
    # process only, so migrations in the build and the clean-up job are never cut short.
    startCommand: DB_STATEMENT_TIMEOUT_MS=25000 GIT_COMMIT=$RENDER_GIT_COMMIT gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /healthz
    # Production is deployed by hand from a commit that already ran on staging.
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      # Secrets and per-environment values: enter in the dashboard (names only here).
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # OTP email over HTTPS (Render's free plan blocks SMTP). brevo or resend; the key is a secret.
      # DEFAULT_FROM_EMAIL must be a sender address the provider has verified.
      - key: EMAIL_API_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Error reporting. Leave unset to disable Sentry. SENTRY_ENVIRONMENT keeps production events apart from staging.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Profile photo uploads (Cloudinary unsigned preset; no secret). Without them the
      # photo endpoint answers 503 "Photo upload is not configured".
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      # Optional: set when a browser admin site exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Staging: same code and settings as production, a separate database, and sample data.
  # Deploys from `main` after CI passes. Do not point an uptime monitor at it (it should sleep).
  - type: web
    name: hostel-hunt-backend-staging
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # DB_STATEMENT_TIMEOUT_MS caps one database statement (25 s, under gunicorn's 60 s). It is set here, on the web
    # process only, so migrations in the build and the clean-up job are never cut short.
    startCommand: DB_STATEMENT_TIMEOUT_MS=25000 GIT_COMMIT=$RENDER_GIT_COMMIT gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: staging
      - key: SENTRY_ENVIRONMENT
        value: staging
      # Values for the STAGING project only (never reuse production's):
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      # OTP email over HTTPS (Render's free plan blocks SMTP). brevo or resend; the key is a secret.
      # DEFAULT_FROM_EMAIL must be a sender address the provider has verified.
      - key: EMAIL_API_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Use Razorpay TEST-mode keys here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Profile photo uploads (Cloudinary unsigned preset; no secret). Without them the
      # photo endpoint answers 503 "Photo upload is not configured".
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false

  # Scheduled clean-up for PRODUCTION (a Render cron job costs at least about $1 per month; confirm on the
  # pricing page). Correctness never depends on it: a lapsed bed hold is also treated as lapsed when it is
  # read or written. It closes stale payments, deletes old OTP records and webhook ids, and flushes expired
  # tokens. Safe to run twice. Staging does not need one.
  #
  # `ping_heartbeat` runs the command and then calls the heartbeat monitor (HEARTBEAT_URL after a success, the
  # same URL plus /fail after a failure), so a cron that stops or fails raises an alert (docs/ALERTS.md).
  # With HEARTBEAT_URL unset it simply runs the command. GIT_COMMIT tags errors with the deployed version.
  - type: cron
    name: hostel-hunt-cleanup
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: GIT_COMMIT=$RENDER_GIT_COMMIT python manage.py ping_heartbeat cleanup_expired
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Same values as the production web service (it needs the database and the settings that must be present).
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Errors from the job reach the same Sentry project as the web service (the production DSN).
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # The heartbeat monitor's ping URL for THIS job. It holds a secret token: dashboard only.
      - key: HEARTBEAT_URL
        sync: false
