# Reference configuration for the Render web service. It documents the
# settings to enter in the Render dashboard; applying it as a Blueprint may
# create a new service instead of adopting the existing one, so copy the
# values by hand unless you intend that.
#
# Nothing in the Django code depends on Render: on your own server run the same
# build commands, start command and environment variables.
services:
  - type: web
    name: hostel-hunt-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    # Migrations run during the build because the free plan has no pre-deploy
    # step. On a paid plan move `migrate` to preDeployCommand.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # GIT_COMMIT tags log lines and Sentry events with the deployed version. Render sets
    # RENDER_GIT_COMMIT; keeping the mapping here keeps the Django code host-neutral.
    startCommand: GIT_COMMIT=$RENDER_GIT_COMMIT gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /healthz
    # Production is deployed by hand from a commit that already ran on staging.
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      # Secrets and per-environment values: enter in the dashboard (names only here).
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Error reporting. Leave unset to disable Sentry.
      - key: SENTRY_DSN
        sync: false
      # Profile photo uploads (Cloudinary unsigned preset; no secret). Without them the
      # photo endpoint answers 503 "Photo upload is not configured".
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      # Optional: set when a browser admin site exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Staging: same code and settings as production, a separate database, and sample data.
  # Deploys from `main` after CI passes. Do not point an uptime monitor at it (it should sleep).
  - type: web
    name: hostel-hunt-backend-staging
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: GIT_COMMIT=$RENDER_GIT_COMMIT gunicorn config.wsgi:application -c gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: staging
      - key: SENTRY_ENVIRONMENT
        value: staging
      # Values for the STAGING project only (never reuse production's):
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Use Razorpay TEST-mode keys here.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Profile photo uploads (Cloudinary unsigned preset; no secret). Without them the
      # photo endpoint answers 503 "Photo upload is not configured".
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
