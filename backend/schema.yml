          type: string
          readOnly: true
          nullable: true
          description: Razorpay payment ID (pay_XXXX). Set once Razorpay processes
            the attempt.
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentAttemptStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - method
      - razorpay_payment_id
      - status
