      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistSaved'
          description: ''
  /api/v1/wishlist/{id}/:
    delete:
      operationId: wishlist_destroy
      description: DELETE /api/v1/wishlist/<saved row id>/ - the first version's way
        to un-save (404 if already gone).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/wishlist/hostel/{hostel_id}/:
    delete:
      operationId: wishlist_hostel_destroy
      description: |-
        DELETE /api/v1/wishlist/hostel/<hostel id>/ - un-save a hostel. Safe to repeat: it answers 200
        whether or not the hostel was saved (`deleted` says which).
      parameters:
      - in: path
        name: hostel_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/wishlist/ids/:
    get:
      operationId: wishlist_ids_retrieve
      description: GET /api/v1/wishlist/ids/ - just the hostel ids the user has saved,
        for the hearts in the app.
      tags:
      - wishlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistIds'
          description: ''
components:
  schemas:
    AdminPayment:
      type: object
      description: |-
        Owner-facing serializer for Payment, used by AdminPaymentListView and
        RefundView.

