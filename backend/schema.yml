  /api/v1/hostels/:
    get:
      operationId: hostels_list
      description: |-
        GET /hostels/                      public list: active hostels, the same for everyone, token or not
        GET /hostels/?scope=mine           the signed-in owner's own hostels (including inactive)
        GET /hostels/?scope=all            every hostel (staff only)
        GET /hostels/{id}/                 public detail of an active hostel; owners can also open their own
        POST/PUT/PATCH/DELETE              owner scoped, as before

        Public list parameters: city, locality (name, slug, alias or id), search (name, locality, address),
        amenity, gender_type, page, page_size (default 10, maximum 50). Ordered newest first, then by id,
        so pages never repeat or skip a hostel.
      parameters:
      - in: query
        name: amenity
        schema:
          type: string
        description: One amenity from the hostel's list, e.g. ac.
      - in: query
        name: city
        schema:
          type: string
        description: 'City name, slug or id (case, spaces and punctuation ignored).
          Without a locality: the whole city.'
      - in: query
        name: gender_type
        schema:
          type: string
          enum:
          - boys
          - co_living
          - girls
      - in: query
        name: locality
        schema:
          type: string
        description: Locality name, slug, alias (e.g. a second spelling) or id. Best
          combined with city.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - all
          - mine
          - public
        description: public (default, same for everyone), mine (the signed-in owner's
          hostels), all (staff).
      - in: query
        name: search
        schema:
          type: string
        description: At least 2 characters; matches name, locality or address, ignoring
          case.
      tags:
      - hostels
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHostelListList'
          description: ''
    post:
      operationId: hostels_create
      description: |-
        GET /hostels/                      public list: active hostels, the same for everyone, token or not
        GET /hostels/?scope=mine           the signed-in owner's own hostels (including inactive)
        GET /hostels/?scope=all            every hostel (staff only)
        GET /hostels/{id}/                 public detail of an active hostel; owners can also open their own
        POST/PUT/PATCH/DELETE              owner scoped, as before

        Public list parameters: city, locality (name, slug, alias or id), search (name, locality, address),
        amenity, gender_type, page, page_size (default 10, maximum 50). Ordered newest first, then by id,
        so pages never repeat or skip a hostel.
      tags:
      - hostels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hostel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Hostel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Hostel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hostel'
          description: ''
  /api/v1/hostels/{hostel_id}/rooms/:
    get:
      operationId: hostels_rooms_list
      description: |-
        Mixin for DRF generic views / ViewSets whose model inherits
        TenantScopedModel. Automatically restricts get_queryset() — and
        therefore get_object() — to records owned by the requesting user's
        tenant (hostel-owner) relationship, using the model's declared
        OWNER_LOOKUP. Add this as the leftmost base class on any view for a
        TenantScopedModel.

        Fail-closed: an unauthenticated request always gets an empty
        queryset, never an unscoped one.
      parameters:
      - in: path
        name: hostel_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - hostels
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoomList'
          description: ''
    post:
      operationId: hostels_rooms_create
      description: |-
        Mixin for DRF generic views / ViewSets whose model inherits
        TenantScopedModel. Automatically restricts get_queryset() — and
        therefore get_object() — to records owned by the requesting user's
        tenant (hostel-owner) relationship, using the model's declared
        OWNER_LOOKUP. Add this as the leftmost base class on any view for a
        TenantScopedModel.

        Fail-closed: an unauthenticated request always gets an empty
        queryset, never an unscoped one.
      parameters:
