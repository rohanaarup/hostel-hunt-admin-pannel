        who made the payment and for which hostel — without requiring the
        client to make additional API calls for each payment record.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        razorpay_order_id:
          type: string
          readOnly: true
          description: Razorpay order ID returned by the Orders API (e.g. order_XXXX).
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Amount in INR (rupees, not paise). Computed server-side from
            Room.price_per_month.
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when signature verification succeeded.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        student_name:
          type: string
          readOnly: true
        student_phone:
          type: string
          readOnly: true
        hostel_name:
          type: string
          readOnly: true
        room_number:
          type: string
          readOnly: true
        bed_number:
          type: string
          readOnly: true
        attempts:
          type: array
