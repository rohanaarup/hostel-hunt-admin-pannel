      type: object
      description: |-
        Student-facing read-only serializer for Payment.

        Includes:
          - All fields the Flutter app needs to display payment status and history.
          - Embedded attempts list.

        Excludes:
          - verified_at (internal audit field, not needed by the student UI).
          - updated_at  (not needed by the student UI).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking:
          type: string
          format: uuid
          readOnly: true
        razorpay_order_id:
          type: string
          readOnly: true
          description: Razorpay order ID returned by the Orders API (e.g. order_XXXX).
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Amount in INR (rupees, not paise). Computed server-side from
            Room.price_per_month.
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
          readOnly: true
      required:
      - amount
      - attempts
      - booking
      - created_at
      - currency
      - id
      - razorpay_order_id
      - status
