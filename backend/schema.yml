  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        Router-registered ViewSet for Booking.

        Standard routes (auto-generated by Router):
            GET    /bookings/          — list bookings for the authenticated owner
            POST   /bookings/          — create a new booking (public, from Flutter app)
            GET    /bookings/<pk>/     — retrieve a single booking
            PUT    /bookings/<pk>/     — (disabled via http_method_names)
            PATCH  /bookings/<pk>/     — (disabled via http_method_names)
            DELETE /bookings/<pk>/     — (disabled via http_method_names)

        Custom actions:
            POST  /bookings/<pk>/approve/   — confirm an offline booking
            POST  /bookings/<pk>/reject/    — reject a booking
            POST  /bookings/<pk>/verify/    — verify online payment and confirm booking
            PATCH /bookings/<pk>/mark_paid/ — mark an offline booking as paid

        Query params (list):
            payment_mode=offline|online
            status=pending|confirmed|paid|cancelled|rejected
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: |-
        Router-registered ViewSet for Booking.

        Standard routes (auto-generated by Router):
            GET    /bookings/          — list bookings for the authenticated owner
            POST   /bookings/          — create a new booking (public, from Flutter app)
            GET    /bookings/<pk>/     — retrieve a single booking
            PUT    /bookings/<pk>/     — (disabled via http_method_names)
            PATCH  /bookings/<pk>/     — (disabled via http_method_names)
            DELETE /bookings/<pk>/     — (disabled via http_method_names)

        Custom actions:
            POST  /bookings/<pk>/approve/   — confirm an offline booking
            POST  /bookings/<pk>/reject/    — reject a booking
            POST  /bookings/<pk>/verify/    — verify online payment and confirm booking
            PATCH /bookings/<pk>/mark_paid/ — mark an offline booking as paid

        Query params (list):
            payment_mode=offline|online
            status=pending|confirmed|paid|cancelled|rejected
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreate'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
